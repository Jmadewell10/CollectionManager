<mat-tab-group>
    <mat-tab label="Login">
        <div mat-dialog-content>
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>User Name</mat-label>
                <input matInput formControlName="userName" type="text" placeholder="User Name">
                <mat-error *ngIf="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched">
                  Enter a valid user name
                </mat-error>
              </mat-form-field>
          
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput formControlName="password" type="password">
                <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                  {{ passwordError }}
                </mat-error>
              </mat-form-field>
          
              <div class="button-container">
                <button mat-button (click)="closeDialog()">Cancel</button>
                <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid">
                  Login
                </button>
              </div>
            </form>
          </div>
    </mat-tab>
    <mat-tab label="Sign Up">
    </mat-tab>    
</mat-tab-group>
