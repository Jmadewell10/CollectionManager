<div class="app-container">
    <div class="header-container">
        <mat-toolbar color="primary">
            <button *ngIf="isLoggedIn" class="nav-menu-button" aria-label="Menu Icon" (click)="toggleMenu()">
                <mat-icon matTooltip="Expand Menu">menu</mat-icon>
            </button>
            <app-header style="flex: auto; margin-left: 50px" [headerText]="headerText"></app-header>
        </mat-toolbar>
    </div>

    <mat-sidenav-container class="sidenav-container">
        <mat-sidenav #sidenav mode="over" [fixedInViewport]="true" [fixedTopGap]="64" [autoFocus]="false">
            <mat-nav-list>
                <a mat-list-item routerLink="/home" routerLinkActive="active-link" (click)="sidenav.close()">
                                        <mat-icon matListItemIcon>home</mat-icon>
                    <span matListItemTitle>Home</span>
                </a>
                <a mat-list-item routerLink="/collections" routerLinkActive="active-link" (click)="sidenav.close()">
                    <mat-icon matListItemIcon>library_books</mat-icon>
                    <span matListItemTitle>Collections</span>
                </a>
            </mat-nav-list>
        </mat-sidenav>

        <mat-sidenav-content>
            <router-outlet />
        </mat-sidenav-content>

    </mat-sidenav-container>
</div>
