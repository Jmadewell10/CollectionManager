<div class="app-container">
    <div class="header-container">
        <mat-toolbar color="primary">
            <button *ngIf="isLoggedIn" class="nav-menu-button" aria-label="Menu Icon" (click)="toggleMenu()">
                <mat-icon matTooltip="Expand Menu">menu</mat-icon>
            </button>

            <app-header style="flex: auto; margin-left: 50px" [headerText]="headerText"></app-header>
        </mat-toolbar>
    </div>  
    <div class="body-container">
        <div *ngIf="!isLoggedIn">
            <app-logged-out-home></app-logged-out-home>
        </div>
    </div>

        <mat-sidenav-container class="sidenav-container">
        <mat-sidenav #sidenav mode="over" [fixedInViewport]="true" [fixedTopGap]="64">
            <mat-nav-list>
                <a mat-list-item routerLink="/collections" routerLinkActive="/collections" (click)="sidenav.close()">
                    <mat-icon matListItemIcon>library_books</mat-icon>
                    <span matListItemTitle>Collections</span>
                </a>
            </mat-nav-list>
        </mat-sidenav>
    </mat-sidenav-container>

</div>
<router-outlet />
